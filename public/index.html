<!doctype html>
<html lang="pt-BR" data-theme="light" class="mob">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#e60012">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sorter">
<meta name="format-detection" content="telephone=no">
<title>Sorter · Mapa</title>
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="mobile.css">
<style>
  #stale{display:none;margin:6px 8px 0;padding:8px 10px;border-radius:8px;background:#fff3cd;color:#664d03;font-size:13px}
  #msg{padding:28px 16px;text-align:center;color:#667085}
  #tipSheet{position:fixed;left:0;right:0;bottom:0;z-index:60;background:#111827;color:#fff;padding:14px 16px 22px;font-size:14px;white-space:pre-wrap;display:none;border-radius:14px 14px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.35)}
  #keyBox{display:none;padding:20px 16px;text-align:center} #keyBox input{width:90%;max-width:360px;padding:10px;font-size:16px;border:1px solid #cbd3e1;border-radius:8px} #keyBox button{margin-top:10px;padding:10px 22px;font-size:16px;border:0;border-radius:8px;background:#e60012;color:#fff}
  #pwaBar{display:none;position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:70;background:#111827;color:#fff;padding:10px 12px;border-radius:12px;font-size:14px;align-items:center;gap:10px;box-shadow:0 6px 24px rgba(0,0,0,.35)}
  #pwaBar span{flex:1} #pwaBar button{border:0;border-radius:8px;padding:8px 12px;font-size:14px;background:#e60012;color:#fff} #pwaBar #pwaX{background:transparent;font-size:22px;padding:0 6px}
</style>
</head>
<body>
<header class="bar">
  <div class="title"><i class="mark"></i><div><b>Sorter Monitor</b></div></div>
  <div class="live" id="live"><i class="pulse"></i><b id="liveState">AO VIVO</b><span id="liveTxt">carregando…</span></div>
</header>
<div id="stale"></div>
<main id="main" data-view="map">
  <section id="viewMap" class="vw vm" style="display:block"><div id="mapBody"><div id="msg">Carregando o mapa…</div></div></section>
</main>
<div id="keyBox"><p>Informe a chave de acesso:</p><input id="keyIn" type="password" autocomplete="off"><br><button id="keyOk">Entrar</button></div>

<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var DEFAULT_KEY = 'hDXSpDzDXpGcOu-f9DVM8gdd'; var KEY = '';
  try { var m = /[#&]k=([^&]+)/.exec(location.hash); if (m) { localStorage.setItem('sorterMapKey', decodeURIComponent(m[1])); history.replaceState(null, '', location.pathname); } KEY = localStorage.getItem('sorterMapKey') || ''; } catch (e) {}
  if (!KEY) KEY = DEFAULT_KEY;
  var zoom = 220; try { zoom = +(localStorage.getItem('sorterMobZoom') || 220); } catch (e) {}
  var applyZ = function () { document.documentElement.style.setProperty('--mz', zoom + '%'); }; applyZ();
  $('#keyOk').onclick = function () { KEY = $('#keyIn').value.trim(); try { localStorage.setItem('sorterMapKey', KEY); } catch (e) {} $('#keyBox').style.display = 'none'; load(); };
  var base = 1, mult = 1, de = document.documentElement;
  function setScale(v) { de.style.setProperty('--ms', v.toFixed(4)); }
  function fit() { base = Math.min(window.innerWidth, de.clientWidth || window.innerWidth) / 1500; setScale(base * mult); }
  fit(); window.addEventListener('resize', fit); window.addEventListener('orientationchange', fit);
  // zoom por pinça próprio (funciona em Android e iPhone, inclusive instalado como app)
  var pz = null;
  function dist(t) { var dx = t[0].clientX - t[1].clientX, dy = t[0].clientY - t[1].clientY; return Math.sqrt(dx * dx + dy * dy) || 1; }
  document.addEventListener('touchstart', function (e) { if (e.touches.length === 2) { var cx = (e.touches[0].clientX + e.touches[1].clientX) / 2, cy = (e.touches[0].clientY + e.touches[1].clientY) / 2; pz = { d: dist(e.touches), m: mult, s: base * mult, fx: (window.scrollX + cx) / (base * mult), fy: (window.scrollY + cy) / (base * mult), cx: cx, cy: cy }; } }, { passive: true });
  document.addEventListener('touchmove', function (e) {
    if (!pz || e.touches.length !== 2) return; e.preventDefault();
    mult = Math.max(1, Math.min(5, pz.m * dist(e.touches) / pz.d)); var ns = base * mult; setScale(ns);
    window.scrollTo(pz.fx * ns - pz.cx, pz.fy * ns - pz.cy);
  }, { passive: false });
  document.addEventListener('touchend', function (e) { if (e.touches.length < 2) pz = null; }, { passive: true });
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  var at = 0, lastAt = 0;
  function ago(ms) { var s = Math.max(0, Math.round(ms / 1000)); return s < 90 ? s + ' s' : Math.round(s / 60) + ' min'; }
  function tick() {
    if (!at) return; var age = Date.now() - at, old = age > 120000;
    $('#liveState').textContent = old ? 'SEM DADOS' : 'AO VIVO'; $('#liveTxt').textContent = 'atualizado há ' + ago(age);
    var st = $('#stale'); st.style.display = old ? 'block' : 'none'; if (old) st.textContent = 'Sem dados novos há ' + ago(age) + '. Confira se o app do Windows está aberto, com a chave e o endereço configurados.';
  }
  function b64gunzip(b64) {
    var bin = atob(b64), u = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    return new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  }
  var busy = false;
  async function load() {
    if (busy) return; busy = true;
    try {
      if (!KEY) { $('#keyBox').style.display = 'block'; busy = false; return; }
      var r = await fetch('/api/state', { headers: { 'x-key': KEY }, cache: 'no-store' });
      if (r.status === 401) { try { localStorage.removeItem('sorterMapKey'); } catch (e) {} KEY = (KEY === DEFAULT_KEY) ? '' : DEFAULT_KEY; if (KEY) { busy = false; return load(); } $('#mapBody').innerHTML = '<div id="msg">Chave inválida.</div>'; $('#keyBox').style.display = 'block'; busy = false; return; }
      if (r.status === 404) { $('#mapBody').innerHTML = '<div id="msg">Ainda sem dados. Abra o app do Windows (com o envio ao celular configurado) e aguarde 1 minuto.</div>'; busy = false; return; }
      if (!r.ok) throw new Error('HTTP ' + r.status);
      var j = await r.json(); if (j.at && j.at === lastAt) { tick(); busy = false; return; } lastAt = j.at || 0; var html = j.z ? await b64gunzip(j.z) : j.html;
      var sx = window.scrollX, sy = window.scrollY, card = document.querySelector('.mapcard'), cl = card ? card.scrollLeft : 0, ct = card ? card.scrollTop : 0;
      $('#mapBody').innerHTML = html; at = j.at || Date.now();
      var c2 = document.querySelector('.mapcard'); if (c2) { c2.scrollLeft = cl; c2.scrollTop = ct; } window.scrollTo(sx, sy);
      tick();
    } catch (e) { $('#liveTxt').textContent = 'sem conexão'; }
    busy = false;
  }
  load(); setInterval(load, 5000); setInterval(tick, 5000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) load(); });
  try { if ('wakeLock' in navigator) navigator.wakeLock.request('screen').catch(function () {}); } catch (e) {}
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
})();
</script>
</body>
</html>
